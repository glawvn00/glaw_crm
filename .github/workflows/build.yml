name: Build Frappe Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: glawvn00/frappe-glaw-crm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create apps.json
        run: |
          cat > frappe_docker/apps.json << 'EOF'
          [
            {
              "url": "https://github.com/frappe/hrms",
              "branch": "version-16"
            },
            {
              "url": "https://github.com/frappe/crm",
              "branch": "main"
            },
            {
              "url": "https://github.com/glawvn00/glaw_crm",
              "branch": "main"
            }
          ]
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:version-16
          build-args: |
            FRAPPE_BRANCH=version-16
          secrets: |
            apps_json=${{ secrets.APPS_JSON }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
